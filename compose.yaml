services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID:-}
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - web

volumes:
  # Здесь Caddy хранит выпущенные сертификаты. Том переживает
  # пересборку контейнеров — повторно выпускать сертификат не нужно.
  caddy_data:
  caddy_config:

networks:
  web:
